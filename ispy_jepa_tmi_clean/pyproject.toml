[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corejepa-ispy"
version = "0.1.0"
description = "Clean longitudinal I-SPY DCE-MRI CoRe-JEPA implementation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["corejepa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

schema_version: 1
authorized_only_if_stage_a_go: true
models:
  L1: {input: legacy_dce7, direct_ftv_grounding: false}
  L3: {input: legacy_dce7, direct_ftv_grounding: true}
  N1: {input: c1b_dce7, direct_ftv_grounding: false}
  N3: {input: c1b_dce7, direct_ftv_grounding: true}
loss:
  lambda_ftv: 0.25
  sigreg: 0.09
  step_weights: [2.0, 1.0, 0.5]
train:
  seed_bases: [2026, 3026]
  folds: [0, 1, 2, 3, 4]
  effective_batch_size: 32
  preferred_physical_batch_size: 4
  preferred_accumulation_steps: 8
  fallback_physical_batch_size: 2
  fallback_accumulation_steps: 16
  data_loader_workers: 2
  prefetch_factor: 1
  effective_batch_drop_last: true
  optimizer_and_ema_per_logical_batch: true
  ftv_patient_numerator_count_across_microbatches: true
  epochs: 12
  patience: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  ema_momentum: 0.996
  max_grad_norm: 5.0
  min_representation_std: 0.05
  transition_modification: false
  pcr_supervision: false
  ld_supervision: false
